<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Standardized Physical Examination</title>
<style>
  :root{
    /* UC Davis: Aggie Blue #022851, Aggie Gold #FFBF00 */
    --paper:#FAFBFC; --sheet:#FFFFFF; --ink:#1B2A3A; --muted:#5B6B7B;
    --accent:#022851; --accent-soft:#E7EDF4; --line:#D5DCE5; --line-soft:#E7ECF2;
    --gold:#FFBF00; --gold-dark:#E6AC00;
    --local:#8A6D00; --local-bg:#FFF8E1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Avenir Next","Avenir","Seravek","Segoe UI",system-ui,sans-serif;
    font-size:15px; line-height:1.45;
  }
  button{font:inherit; cursor:pointer}

  .topbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 22px; background:var(--accent); color:#fff; position:sticky; top:0; z-index:40}
  .topbar h1{font-size:16.5px; margin:0; font-weight:600; letter-spacing:.2px}
  .topbar .sub{font-size:12px; opacity:.72}
  .topbar .spacer{flex:1}
  .modeswitch{display:flex; background:rgba(255,255,255,.12); border-radius:6px; padding:3px}
  .modeswitch button{background:none; border:none; color:#fff; opacity:.8; padding:6px 14px; border-radius:4px; font-size:13px; font-weight:600}
  .modeswitch button.on{background:var(--gold); color:var(--accent); opacity:1}
  .lensswitch{display:flex; gap:3px; background:rgba(255,255,255,.12); border-radius:6px; padding:3px}
  .lensswitch button{background:none; border:none; color:#fff; opacity:.72; padding:6px 12px; border-radius:4px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap}
  .lensswitch button.on{background:#fff; color:var(--accent); opacity:1}
  .chip{background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); border-radius:4px; padding:4px 10px; font-size:13px; font-variant-numeric:tabular-nums}
  .btn-print{background:var(--gold); color:var(--accent); border:none; border-radius:4px; padding:7px 14px; font-weight:600; font-size:13px}
  .btn-print.ghost{background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.35)}
  .btn-print:hover{background:var(--gold-dark); color:var(--accent)}
  .btn-print.ghost:hover{background:rgba(255,255,255,.24); color:#fff}
  .btn-print:focus-visible,.toggle input:focus-visible,button:focus-visible,input.ck:focus-visible,.pick:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

  .wrap{display:flex; gap:26px; padding:22px; max-width:1360px; margin:0 auto; align-items:flex-start}
  aside{width:300px; flex:0 0 300px; display:flex; flex-direction:column; gap:16px}
  main{flex:1; min-width:0}
  @media (max-width:900px){ .wrap{flex-direction:column} aside{width:100%; flex:1 1 auto} }

  .panel{background:var(--sheet); border:1px solid var(--line); border-radius:6px; padding:14px 16px}
  .panel h2{margin:0 0 10px; font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
  .toggle{display:flex; align-items:center; gap:8px; padding:3px 0; font-size:13.8px}
  .toggle input{accent-color:var(--accent)}
  .toggle .pts{margin-left:auto; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums}
  .radio{display:flex; align-items:center; gap:8px; padding:4px 0; font-size:14px}
  .radio input{accent-color:var(--accent)}
  .mini{display:flex; gap:8px; margin-top:8px}
  .mini button{flex:1; border:1px solid var(--line); background:#fff; border-radius:4px; padding:4px 0; font-size:12.5px; color:var(--accent); font-weight:600}
  .mini button:hover{background:var(--accent-soft)}
  .rulebox{background:var(--accent-soft); border:1px solid #C9D9E8; border-radius:6px; padding:13px 15px; font-size:13px}
  .rulebox h2{color:var(--accent)}
  .rulebox p{margin:0 0 8px}
  .rulebox p:last-child{margin:0}
  .rulebox b{color:var(--accent)}
  .raters{display:flex; flex-direction:column; gap:9px; margin-top:6px}
  .rater{display:flex; gap:9px; align-items:flex-start; font-size:12.5px}
  .rater .k{flex:0 0 74px; font-weight:700; color:var(--accent)}
  .about{font-size:12px; color:var(--muted)}
  .about p{margin:0 0 7px}

  .sheet{background:var(--sheet); border:1px solid var(--line); border-radius:6px; padding:34px 40px 40px; box-shadow:0 1px 3px rgba(27,42,58,.07)}
  .sheet-head{border-bottom:3px solid var(--accent); padding-bottom:14px; margin-bottom:6px}
  .sheet-head .prog{font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); border-bottom:1px dashed transparent; min-width:120px; display:inline-block}
  .sheet-head .prog:hover,.sheet-head .prog:focus{border-bottom-color:var(--muted); outline:none}
  .sheet-head h2{margin:2px 0 4px; font-size:23px; font-weight:700; color:var(--accent); text-wrap:balance}
  .sheet-head .meta{font-size:12.5px; color:var(--muted)}
  .idline{display:flex; gap:30px; margin:14px 0 4px; font-size:13px; color:var(--muted); flex-wrap:wrap}
  .idline span{flex:1; min-width:150px; border-bottom:1px solid var(--line); padding-bottom:3px}
  .idline .live{color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums}

  section.sys{margin-top:24px; break-inside:avoid-page}
  .sys-head{display:flex; align-items:baseline; gap:10px; background:var(--accent); color:#fff; border-radius:4px 4px 0 0; padding:7px 14px}
  .sys-head h3{margin:0; font-size:15px; font-weight:600; letter-spacing:.2px}
  .sys-head .pts{margin-left:auto; font-size:12.5px; opacity:.85; font-variant-numeric:tabular-nums}
  .ros{border-left:3px solid var(--gold); background:var(--accent-soft); margin:0; padding:7px 14px; font-size:13px}
  .ros b{color:var(--accent)}
  table.items{width:100%; border-collapse:collapse; border:1px solid var(--line-soft); border-top:none}
  tr.phase td{background:var(--accent); color:#fff; padding:6px 14px; font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase}
  .ghead td{padding:7px 14px 4px; font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); border-top:1px solid var(--line-soft); background:#F3F7FA}
  tr.item td{border-top:1px solid var(--line-soft); padding:5px 8px; vertical-align:top}
  tr.item:hover td{background:#F6F9FB}
  td.bx{width:34px; text-align:center; padding-top:6px}
  input.ck{width:15px; height:15px; accent-color:var(--accent); cursor:pointer; margin:0}
  td.score{width:70px; text-align:right; white-space:nowrap; color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums; padding-right:14px; padding-top:6px}
  td.opts{width:104px; text-align:right; white-space:nowrap; padding-right:12px; padding-top:4px}
  .pick{display:inline-block; min-width:22px; text-align:center; border:1px solid var(--line); border-radius:3px; padding:1px 4px; margin-left:4px; font-size:12.5px; color:#8794A2; cursor:pointer; user-select:none; font-variant-numeric:tabular-nums}
  .pick:hover{border-color:var(--accent); color:var(--accent)}
  .pick.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700}
  tr.local td{background:var(--local-bg)}
  tr.local:hover td{background:#FFF3C4}
  .local-chip{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.06em; color:var(--local); border:1px solid var(--local); border-radius:3px; padding:0 5px; margin-left:7px; vertical-align:1px}
  .rm{border:none; background:none; color:var(--local); font-size:14px; padding:0 4px}
  .rmspec{border:none; background:none; color:#9AA7B4; font-size:12px; padding:0 3px; vertical-align:1px}
  .rmspec:hover{color:#B3261E}
  .vchip{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.05em; color:var(--muted); border:1px solid var(--line); border-radius:3px; padding:0 4px; margin-left:6px; vertical-align:1px; white-space:nowrap}
  .mini-restore{border:1px solid var(--line); background:#fff; border-radius:4px; padding:1px 8px; font-size:11.5px; color:var(--accent); font-weight:600}
  .mini-restore:hover{background:var(--accent-soft)}
  .addrow td{border-top:1px solid var(--line-soft); padding:5px 8px 7px 8px}
  .addrow input{width:100%; border:1px dashed var(--line); border-radius:4px; padding:5px 9px; font:inherit; font-size:13.5px; background:transparent; color:var(--ink)}
  .addrow input::placeholder{color:#9AA7B4}
  .addrow input:focus{outline:none; border-color:var(--accent); background:#fff}
  .evnote{border:1px solid var(--line-soft); border-top:none; padding:7px 14px; font-size:12.5px; font-style:italic; color:#55636F; background:#FAFBFC}
  .evnote b{color:var(--accent); font-style:normal}
  .osce-banner{background:var(--accent-soft); border:1px solid #C9D9E8; border-radius:6px; padding:11px 15px; font-size:12.5px; margin:16px 0 4px}
  .osce-banner b{color:var(--accent)}
  tr.subrow td.subc{padding-left:30px; color:var(--muted); font-size:12.8px; font-style:italic}
  .sheet-foot{margin-top:30px; font-size:11.5px; color:var(--muted); border-top:1px solid var(--line); padding-top:10px}
  .sheet-foot p{margin:0 0 6px}

  /* Practice (peer-grading) mode: bigger tap targets, no rubric editing */
  body.practice .pick{min-width:42px; padding:8px 0; margin-left:7px; font-size:16px; border-radius:6px}
  body.practice td.opts{width:180px}
  body.practice tr.item td{padding:10px 10px; font-size:15.5px}
  body.practice .addrow,body.practice .rmspec,body.practice .vchip{display:none}
  .tclock{font-size:34px; font-weight:700; text-align:center; font-variant-numeric:tabular-nums; color:var(--accent); margin:2px 0 8px; letter-spacing:1px}
  .tclock.low{color:#B3261E}
  .tdur{display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:8px}
  .tdur input{width:60px; border:1px solid var(--line); border-radius:4px; padding:4px 6px; font:inherit}
  .attempt{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:3px 0; font-variant-numeric:tabular-nums}
  .attempt .pct{font-weight:700; color:var(--accent)}
  .missed{font-size:12.5px; margin:0; padding-left:18px}
  .missed li{margin:0 0 3px}
  .btn-finish{width:100%; background:var(--gold); color:var(--accent); border:none; border-radius:5px; padding:9px 0; font-weight:700; font-size:14px; margin-top:6px}
  .btn-finish:hover{background:var(--gold-dark)}

  @media print{
    @page{margin:14mm}
    body{background:#fff; font-size:12.5px}
    .topbar,aside{display:none}
    .wrap{padding:0; display:block; max-width:none}
    .sheet{border:none; box-shadow:none; padding:0; border-radius:0}
    section.sys{break-inside:auto}
    .sys-head,tr.phase td{border-radius:0; -webkit-print-color-adjust:exact; print-color-adjust:exact}
    tr.item{break-inside:avoid}
    .rm,.addrow{display:none}
    .pick{border-color:#999}
    .pick.on{background:var(--accent) !important; color:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
    tr.local td{background:#FFF8E1 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  }

  /* ---- practice guidance (410D pattern) ---- */
  .help{margin:7px 0 2px;font-size:12.6px;line-height:1.5;background:#F7F9FB;
        border-left:3px solid var(--gold);padding:7px 11px;border-radius:0 7px 7px 0;max-width:70ch}
  .help .hlabel{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
        font-weight:700;color:var(--gold-dark);margin-bottom:2px}
  .help .htext{color:#2A3340}
  .help.say{border-left-color:var(--accent)}
  .help.say .hlabel{color:var(--accent)}
  .help.say .htext{font-style:italic}
  .help.narrate{border-left-color:#6B46C1}
  .help.narrate .hlabel{color:#6B46C1}
  .help.narrate .htext{font-style:italic}
  .help.tip{border-left-color:var(--muted)}
  .help.tip .hlabel{color:var(--muted)}
  .help.tip .htext{color:var(--muted)}
  .reflink{display:inline-block;margin-top:7px;font-size:12px;font-weight:700;color:var(--accent);
        text-decoration:none;border:1px solid #CFE0F3;background:#fff;border-radius:6px;padding:3px 10px}
  .reflink:hover{background:var(--accent-soft)}
  body:not(.practice) .help{display:none}
  @media print{ .help{background:#fff;border-left:2px solid #999} .reflink{display:none} }

  /* ---- practice-only "named but not scored" footnote ---- */
  .offrubric{margin:8px 0 2px;padding:9px 12px;border:1px dashed var(--line);border-radius:8px;
        background:#FBFAF6;font-size:12.3px;line-height:1.55;color:var(--muted);max-width:76ch}
  .offrubric .oflabel{display:block;font-size:11px;letter-spacing:0;
        font-weight:700;color:var(--gold-dark);margin-bottom:3px}
  body:not(.practice) .footnote-row{display:none}
  @media print{ .footnote-row{display:none} }

  .offrubric.pocus{background:#F2F8F5;border-color:#BBD9C9;border-style:solid}
  .offrubric.pocus .oflabel{color:#2E6B4F}
</style>
</head>
<body>


<div class="topbar">
  <div>
    <h1>The Standardized Physical Examination</h1>
    <div class="sub">Comprehensive PE · OSCE grading · Peer practice · CC BY-NC 4.0</div>
  </div>
  <div class="modeswitch">
    <button id="mComp" class="on" onclick="setMode('comp')">Comprehensive PE</button>
    <button id="mOsce" onclick="setMode('osce')">OSCE / SOAP grading</button>
    <button id="mPrac" onclick="setMode('practice')">Practice</button>
  </div>
  <div class="lensswitch" id="lensswitch" style="display:none">
    <button id="lContent" onclick="setLens('content')">SOAP content</button>
    <button id="lComm" onclick="setLens('comm')">Video observation</button>
    <button id="lBoth" class="on" onclick="setLens('combined')">Combined</button>
  </div>
  <div class="spacer"></div>
  <div class="chip" id="topclock" style="display:none">15:00</div>
  <div class="chip" id="scorechip">Score 0 / 0</div>
  <button class="btn-print" onclick="window.print()">Save PDF</button>
  <button class="btn-print ghost" onclick="exportDoc()">Download .doc</button>
</div>

<div class="wrap">
  <aside id="aside"></aside>
  <main>
    <div class="sheet" id="sheet">
      <div class="sheet-head">
        <span class="prog" id="progname" contenteditable="true" spellcheck="false">Your program name — click to edit</span>
        <h2 id="sheettitle">Standardized Physical Examination Rubric</h2>
        <div class="meta" id="sheetmeta"></div>
        <div class="idline"><span>Student</span><span>Evaluator</span><span>Date</span><span id="sheettot">Score: <span class="live">0</span> / 0</span></div>
      </div>
      <div id="osceBanner"></div>
      <div id="sections"></div>
      <div class="sheet-foot" id="sheetfoot"></div>
    </div>
  </main>
</div>

<script>
const COMP = [
 {
  "title": "Setting the Stage and the Comprehensive History",
  "ros": null,
  "note": null,
  "groups": [
   {
    "name": "Encounter set-up",
    "items": [
     {
      "text": "Professional dress; identification visible",
      "hk": "tip",
      "d": "Bates opens the encounter with professional appearance and a visible identifier. Check the coat and badge before entering."
     },
     {
      "text": "Introduce yourself by name and role",
      "hk": "say",
      "d": "Hi, I'm [name], one of the PA students on your care team today."
     },
     {
      "text": "Wash hands in view of the patient",
      "hk": "tip",
      "d": "Do it where the patient can see you, not in the hallway. It is scored on being witnessed."
     },
     {
      "text": "Verify patient name and date of birth",
      "hk": "say",
      "d": "Before we start, can you tell me your full name and date of birth?"
     },
     {
      "text": "Ask how the patient wishes to be addressed (including pronouns)",
      "hk": "say",
      "d": "How would you like me to address you? I use [pronouns] — do you have pronouns you'd like me to use?"
     },
     {
      "text": "Set the agenda and expected visit length",
      "hk": "say",
      "d": "We have about [X] minutes today. I'd like to hear what brought you in, then do an exam. Anything else you want to be sure we cover?"
     },
     {
      "text": "Explain the physical examination and obtain permission to proceed",
      "hk": "say",
      "d": "I'd like to examine you now. I'll tell you what I'm doing as I go — is that okay?"
     },
     {
      "text": "Maintain patient comfort and privacy with appropriate positioning and draping",
      "short": "Patient comfort, privacy, positioning, draping",
      "hk": "tip",
      "d": "Curtain closed, gown on, drape folded down only to the area you are examining, then covered right back up."
     }
    ]
   },
   {
    "name": "History",
    "items": [
     {
      "text": "Chief complaint in the patient's own words",
      "hk": "say",
      "d": "What brings you in today? — then chart the answer in their words, not a diagnosis."
     },
     {
      "text": "Allow an uninterrupted opening statement",
      "hk": "tip",
      "d": "Stay quiet for the first 60–90 seconds. Most patients finish on their own, and interrupting is the commonest scored error."
     },
     {
      "text": "Opens with an open-ended question before narrowing to closed questions",
      "hk": "say",
      "d": "Tell me more about that. — Open first, then narrow to yes/no questions once the story is out."
     },
     {
      "text": "Elicits the patient's ideas, concerns, and expectations (ICE)",
      "hk": "say",
      "d": "What do you think might be going on? What worries you most about it? What were you hoping we could do today?"
     },
     {
      "text": "Responds to emotion with empathy (PEARLS: partnership, empathy, apology, respect, support)",
      "short": "Responds to emotion with empathy (PEARLS)",
      "hk": "say",
      "d": "That sounds really frustrating. — Name the emotion, then partner: We'll work on this together."
     },
     {
      "text": "HPI: OLDCARTS (Onset, Location, Duration, Character, Alleviating/Aggravating, Radiation, Timing, Severity)",
      "split": [
       "Onset",
       "Location",
       "Duration",
       "Character / quality",
       "Aggravating factors",
       "Alleviating factors",
       "Radiation",
       "Timing (constant vs. intermittent; frequency)",
       "Severity (0-10 or functional impact)"
      ],
      "hk": "tip",
      "d": "Onset, Location, Duration, Character, Alleviating/Aggravating, Radiation, Timing, Severity. Work through them in whatever order the story flows."
     },
     {
      "text": "Setting in which the symptom occurs (Bates' 7th attribute)",
      "short": "Setting",
      "hk": "say",
      "d": "Where are you and what are you doing when this happens?"
     },
     {
      "text": "Associated symptoms (pertinent positives and negatives)",
      "hk": "say",
      "d": "Have you noticed anything else along with it? — then ask directly about the red flags for your differential."
     },
     {
      "text": "Recent travel or sick contacts",
      "hk": "say",
      "d": "Any travel recently, or anyone around you sick?"
     },
     {
      "text": "Pertinent positives and negatives for the chief complaint",
      "hk": "tip",
      "d": "Ask about the symptoms that would confirm or exclude your top differentials, and document the negatives too."
     },
     {
      "text": "Past medical history (diagnoses, control, last follow-up)",
      "hk": "say",
      "d": "What medical problems do you have? When were you diagnosed, how well is it controlled, and when were you last seen for it?"
     },
     {
      "text": "Surgical history (type, year, indication)",
      "hk": "say",
      "d": "Any surgeries? What was it for, what year, and were there any complications?"
     },
     {
      "text": "Family history: first-degree relatives and grandparents - age, health, or age and cause of death",
      "short": "Family history: first-degree relatives and grandparents",
      "hk": "say",
      "d": "Tell me about your parents, brothers and sisters, and grandparents — are they living, and what health problems run in the family?"
     },
     {
      "text": "Social history: FED TACOS (Food, Exercise, Drugs, Tobacco, Alcohol, Caffeine, Occupation, Stress/sleep/SES/sexual health/safety/support)",
      "split": [
       "Social history — Food / diet",
       "Social history — Exercise",
       "Social history — Drugs",
       "Social history — Tobacco / nicotine",
       "Social history — Alcohol",
       "Social history — Caffeine",
       "Social history — Occupation",
       "Social history — Stress, sleep, SES, sexual health, safety, support"
      ],
      "hk": "tip",
      "d": "Food, Exercise, Drugs, Tobacco, Alcohol, Caffeine, Occupation, and Stress/sleep/SES/sexual health/safety/support. Normalize before the sensitive ones."
     },
     {
      "text": "Medications: name, dose, route, frequency - including OTC, supplements, eye drops, patches, creams, and medicines borrowed from others",
      "short": "Medications: name, dose, route, frequency",
      "hk": "say",
      "d": "What medicines do you take? — and prompt for over-the-counter, supplements, eye drops, patches, creams, and anything borrowed from family."
     },
     {
      "text": "Allergies: drug, food, and environmental - with the reaction (or NKDA)",
      "hk": "say",
      "d": "Any allergies to medicines, foods, or things in the environment? What happens when you're exposed?"
     },
     {
      "text": "Immunizations and age-appropriate screenings - up to date or not",
      "hk": "say",
      "d": "Are your vaccines up to date? Have you had the screenings due for your age?"
     }
    ]
   }
  ]
 },
 {
  "title": "General Survey and Vital Signs",
  "ros": "Change in weight, fever, fatigue, night sweats, chills.",
  "note": "NEWS2 tracks ward deterioration better than isolated vitals; the Surviving Sepsis Campaign advises against qSOFA as a sole screen (too insensitive). Pair either with a lactate.",
  "groups": [
   {
    "name": "General survey",
    "items": [
     {
      "text": "Level of consciousness and orientation (A&O x4)",
      "hk": "narrate",
      "d": "Patient is awake, alert, and oriented to person, place, time, and situation."
     },
     {
      "text": "Apparent state of health",
      "hk": "narrate",
      "d": "Patient appears generally well, in no acute distress."
     },
     {
      "text": "Skin color and obvious lesions",
      "hk": "narrate",
      "d": "Bates general-survey component: report skin colour and any obvious lesions — e.g. no jaundice, pallor, cyanosis or obvious lesions.",

      "hk": "narrate",

      "hk": "say",

     {
      "text": "Respiratory rate: count for one full minute, unobtrusively",
      "short": "Respiratory rate",
      "hk": "tip",

     {

     {
      "text": "Pulse oximetry",
      "hk": "say",

     }

 {
  "title": "Head, Eyes, Ears, Nose, and Throat",
  "ros": "Head: headache, injury, dizziness. Eyes: vision, pain, redness, diplopia, floaters/flashes. Ears: hearing, tinnitus, vertigo, discharge. Nose: congestion, epistaxis, sinus pain. Throat/mouth: dental, gums, sore throat, hoarseness.",
  "note": "For acute vestibular syndrome (continuous vertigo with nystagmus), the HINTS exam is more sensitive than early MRI for posterior-circulation stroke (−LR 0.00; Kattah 2009). It is valid only in true acute vestibular syndrome, and a NORMAL head-impulse test is the worrisome result.",
  "groups": [
   {
    "name": "Head",
    "items": [
     {
      "text": "Inspect and palpate skull: symmetry, shape, deformity, trauma",
      "hk": "say",
      "d": "I'm going to feel over your scalp and skull. Tell me if anything is tender."
     },
     {
      "text": "Inspect scalp and hair",
      "hk": "say",
      "d": "I'm going to part your hair and look at your scalp. — Bates: inspect scalp and hair for texture, distribution, and any lesions or scaling."
     },
     {
      "text": "Inspect facial bones and features for symmetry",
      "hk": "narrate",
      "d": "Facial features symmetric, no swelling, asymmetry or deformity."
     }
    ]
   },
   {
    "name": "Eyes",
    "items": [
     {
      "text": "Inspect position, conjunctiva, sclera, pupils",
      "lr": "(conjunctival rim pallor, +LR 4.5 for anemia; sunken eyes +LR 3.4 but NS, CI 1.0-12.2, for hypovolemia)",
      "tier": "C",
      "hk": "say",
      "d": "Look straight ahead for me while I look at your eyes."
     },
     {
      "text": "Inspect brows, eyelids, lacrimal system",
      "hk": "say",
      "d": "Just looking around your eyelids and the inner corner of each eye."
     },
     {
      "text": "Visual acuity (Snellen)",
      "hk": "say",
      "d": "Cover one eye and read the smallest line you can. — Bates: Snellen at 20 ft with glasses on; record the smallest line read and whether corrected."
     },
     {
      "text": "Visual fields by confrontation",
      "hk": "say",
      "d": "Look right at my nose and tell me when you see my fingers move. — Bates: test each of the four quadrants of each eye; fields extend farthest temporally."
     },
     {
      "text": "Six cardinal directions of gaze; convergence; accommodation",
      "hk": "say",
      "d": "Keep your head still and follow my finger with just your eyes. Now watch it come in toward your nose."
     },
     {
      "text": "Oblique lighting: inspect the cornea and iris",
      "hk": "how",
      "d": "Shine a penlight across the eye from the side, not straight on. The oblique beam shows corneal opacities and the iris detail."
     },
     {
      "text": "Pupillary light reaction: dim room, bright light obliquely, patient gazing into the distance (direct and consensual)",
      "lr": "(consensual photophobia, +LR 28.8 for serious eye disease; wide CI)",
      "tier": "A",
      "short": "Pupillary light reaction (direct and consensual)",
      "hk": "say",
      "d": "Look at the wall behind me. — Bates: in dim light, shine a bright light obliquely into each pupil; the distant gaze and oblique beam both prevent a near reaction. Note direct and consensual.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/pupillary.html"
     },
     {
      "text": "Ophthalmoscopy: red reflex (about 15 in away, 15 degrees lateral to the line of vision)",
      "short": "Ophthalmoscopy: red reflex",
      "hk": "how",
      "d": "From about 15 inches away and 15 degrees lateral to the line of vision, shine the scope at the pupil and look for the orange glow.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/fundoscopic.html"
     },
     {
      "text": "Ocular alignment: corneal light reflection and cover-uncover test",
      "hk": "how",
      "d": "Shine a light at both eyes from 2 ft and check the reflection sits at the same spot on each cornea, then cover and uncover each eye watching for a shift."
     },
     {
      "text": "Ophthalmoscopy: retina, vessels, optic disc",
      "hk": "say",
      "d": "I'll dim the lights and look into the back of your eye. Keep looking at the spot on the wall behind me.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/fundoscopic.html"
     }
    ],
    "pocus": "Retinal detachment. (STFM Delphi 2026)"
   },
   {
    "name": "Ears",
    "items": [
     {
      "text": "Inspect and palpate the auricle, tragus, and mastoid (tragus tug)",
      "hk": "say",
      "d": "I'm going to look at and press around your ear. Tell me if this is sore. — Pain on tragal tug suggests otitis externa rather than media."
     },
     {
      "text": "Auditory acuity: whisper test at 2–3 ft",
      "hk": "how",
      "d": "Stand behind the patient, occlude and rub the opposite tragus, exhale fully, then whisper a set of letters/numbers from 2–3 ft. 3 of 6 correct passes."
     },
     {
      "text": "Finger-rub test bilaterally",
      "hk": "how",
      "d": "Rub your fingers together about 6 inches from each ear and ask whether the patient hears it on both sides."
     },
     {
      "text": "Otoscopy bilaterally: canal and tympanic membrane",
      "hk": "say",
      "d": "I'll look inside your ear now. — Bates: largest speculum that fits, pull the auricle up, back and slightly out, insert down and forward. Identify the cone of light, umbo, malleus handle and short process, pars flaccida and tensa."
     }
    ]
   },
   {
    "name": "Ears — special tests",
    "items": [
     {
      "text": "Rinne test",
      "hk": "how",
      "d": "Bates: quiet room, 512-Hz fork. Place the base on the mastoid until sound stops, then hold the prongs near the ear canal. Normally air conduction outlasts bone conduction (AC > BC). Use only in a patient who fails the whispered voice test.",
      "url": "https://www.physio-pedia.com/Rinne_Test"
     },
     {
      "text": "Weber test",
      "hk": "how",
      "d": "Bates: quiet room, 512-Hz fork on the vertex in the midline. Ask where the sound is heard — normally midline. Lateralizes to the affected ear in conductive loss and away from it in sensorineural loss.",
      "url": "https://www.physio-pedia.com/Weber_Test"
     }
    ]
   },
   {
    "name": "Nose",
    "items": [
     {
      "text": "Inspect position, symmetry, skin",
      "hk": "narrate",
      "d": "Nose midline and symmetric, no external deformity or skin change."
     },
     {
      "text": "Test patency of each nostril; inspect the nasal tip (manipulate as little as possible if tender)",
      "short": "Test patency of each nostril; inspect the nasal tip",
      "hk": "say",
      "d": "Press this nostril closed and breathe in through the other side for me."
     },
     {
      "text": "Palpate the frontal and maxillary sinuses",
      "hk": "say",
      "d": "I'm going to press on your forehead and cheeks. Tell me if it's tender. — Bates: upward pressure under the brows for the frontal, upward under the zygoma for the maxillary."
     },
     {
      "text": "Internal inspection with otoscope and speculum",
      "hk": "say",
      "d": "I'm going to look inside your nose with this light. — Inspect mucosa, septum, and inferior and middle turbinates."
     }
    ]
   },
   {
    "name": "Mouth and throat",
    "items": [
     {
      "text": "Inspect lips, teeth, gums, tongue, hard/soft palate, pharynx, buccal mucosa",
      "hk": "say",
      "d": "Open up for me and I'll shine a light inside.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/tongue.html"
     },
     {
      "text": "Palpate the floor of the mouth (bimanual), tongue (including lateral borders), buccal mucosa, gums, and teeth",
      "short": "Palpate floor of mouth, tongue, buccal mucosa, gums, teeth",
      "hk": "say",
      "d": "I'm going to feel under your tongue with a gloved finger. Say if it's uncomfortable. — Inspect and palpate the lateral tongue borders; this is the oral-cancer check."
     },
     {
      "text": "Tongue protrusion (CN XII)",
      "hk": "say",
      "d": "Stick your tongue straight out. — Bates: also inspect the tongue at rest for atrophy or fasciculations; watch for deviation on protrusion."
     },
     {
      "text": "Palate rise on “Ahh” (CN IX/X); assess swallow",
      "hk": "say",
      "d": "Open and say ahh for me while I watch the roof of your mouth."
     }
    ]
   }
  ]
 },
 {
  "title": "Neck",
  "ros": "Swollen glands, goiter, lumps, neck pain or stiffness.",
  "note": null,
  "groups": [
   {
    "name": "Core examination",
    "items": [
     {
      "text": "Inspect neck, thyroid, tracheal position",
      "hk": "narrate",
      "d": "Neck symmetric, trachea midline, no visible thyroid enlargement or masses.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/thyroid.html"
     },
     {
      "text": "Observe swallowing for thyroid motion",
      "hk": "say",
      "d": "Take a sip of water, hold it, and swallow when I say. — Watch the thyroid and cricoid rise.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/thyroid.html"
     },
     {
      "text": "Palpate the thyroid (from behind and in front, during a swallow): size, shape, consistency, nodules, tenderness",
      "short": "Palpate the thyroid",
      "hk": "say",
      "d": "I'm going to feel your thyroid from behind while you swallow again.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/thyroid.html"
     },
     {
      "text": "Palpate the cervical lymph node chains: preauricular, retroauricular, occipital, tonsillar, submandibular, submental, superficial and deep cervical, posterior triangle, supraclavicular",
      "short": "Palpate the cervical lymph node chains",
      "hk": "say",
      "d": "I'm going to feel the glands in your neck. — Work a set order: preauricular, retroauricular, occipital, tonsillar, submandibular, submental, superficial and deep cervical, posterior triangle, supraclavicular.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/lymph.html"
     },
     {
      "text": "Assess for nuchal rigidity when meningeal irritation is suspected",
      "lr": "(neck stiffness, +LR 6.6 for subarachnoid hemorrhage; Carpenter 2016)",
      "tier": "B",
      "hk": "how",
      "d": "With the patient supine, passively flex the neck. Resistance or pain suggests meningeal irritation. Confirm no cervical injury first."
     },
     {
      "text": "Auscultate the thyroid for a bruit if enlarged",
      "hk": "how",
      "d": "If the gland is enlarged, listen over each lobe with the bell for a bruit."
     }
    ]
   }

 },
 {
  "title": "Thorax and Lungs",
  "ros": "Cough, sputum, hemoptysis, wheeze, dyspnea, orthopnea, paroxysmal nocturnal dyspnea, pleuritic pain.",
  "note": "Lung ultrasound outperforms auscultation and supine radiography: pneumonia +LR ~16 (Desai 2024); pneumothorax sens ~90% (lung-point sign ~100% specific); pleural effusion sens ~95%. B-lines are the bedside sign of cardiogenic edema (+LR ~9).",
  "groups": [
   {
    "name": "Core examination",
    "items": [
     {
      "text": "Inspect rate, rhythm, depth, effort, expiratory time",
      "hk": "narrate",
      "d": "Breathing is unlaboured at a normal rate, no accessory muscle use, expiratory phase not prolonged."
     },
     {
      "text": "Inspect chest shape, size, symmetry",
      "hk": "narrate",
      "d": "Bates: note the anteroposterior-to-lateral diameter ratio (normally 0.7–0.9; over 0.9 suggests barrel chest) and any deformity or asymmetry."
     },
     {
      "text": "Inspect skin and chest landmarks",
      "hk": "narrate",
      "d": "Chest wall skin intact, no scars, lesions or asymmetry of landmarks."
     },
     {
      "text": "Compress the chest wall anteroposteriorly (only if rib fracture is suspected)",
      "short": "Compress the chest wall AP (if rib fracture suspected)",
      "hk": "how",
      "d": "Only if a rib fracture is suspected: one hand on the sternum, one on the thoracic spine, and compress. Localized pain suggests fracture."
     },
     {
      "text": "Assess chest expansion (anterior and posterior)",
      "hk": "say",
      "d": "Take a deep breath in for me. — Bates: thumbs at about the level of the 10th ribs posteriorly, fingers loosely parallel to the lateral rib cage, sliding medially to raise a loose skin fold over the spine. Watch your thumbs move apart."
     },
     {
      "text": "Assess tactile fremitus (anterior and posterior)",
      "lr": "(reduced fremitus is the best rule-out for effusion, −LR 0.21; Wong 2009)",
      "tier": "C",
      "hk": "say",
      "d": "Say ninety-nine each time I touch your back. — Bates: use the ball or ulnar surface of the hand, comparing symmetric areas, and identify any increased, decreased or absent fremitus."
     },
     {
      "text": "Percuss the posterior chest at 3 paired sites (left and right at each level); expand if abnormal",
      "short": "Percuss posterior chest (3 paired sites; expand if abnormal)",
      "hk": "say",
      "d": "I'm going to tap down your back. — Bates: ladder pattern, one side then the other at each level, two strikes per site, omitting over the scapulae. Three paired levels is the core; if you find an abnormal note, expand to map its borders.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/pulmonary.html"
     },
     {
      "text": "Percuss the anterior and lateral chest if clinically indicated",
      "short": "Percuss anterior / lateral chest (if indicated)",
      "hk": "tip",
      "d": "Bates percusses the anterior and lateral chest only if clinically indicated, in the same ladder pattern. Displace the breast or ask the patient to move it."
     },
     {
      "text": "Identify diaphragmatic excursion posteriorly",
      "hk": "say",
      "d": "Take a deep breath in and hold it… now let it all out and hold. — Percuss the level of dullness in each phase; normal excursion is 3–5.5 cm.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/pulmonary.html"
     },
     {
      "text": "Auscultate the posterior chest at 3 paired sites (left and right at each level); expand if abnormal",
      "short": "Auscultate posterior chest (3 paired sites; expand if abnormal)",
      "hk": "say",
      "d": "Cross your arms in front and breathe deeply through your mouth. — Bates: same ladder pattern as percussion, comparing side to side at each level. Three paired levels is the core; expand if you hear anything abnormal.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/pulmonary.html"
     },
     {
      "text": "Auscultate the lateral chest at 1 paired site (mid-axillary, left and right); expand if abnormal",
      "short": "Auscultate lateral chest (1 paired site; expand if abnormal)",
      "hk": "say",
      "d": "A couple more deep breaths while I listen under each arm. — Bates: compare the two sides at the same level through the full expiratory phase. Expand if abnormal."
     },
     {
      "text": "Auscultate the anterior chest at 2 paired sites above the breast; expand if abnormal",
      "short": "Auscultate anterior chest (2 paired sites above the breast; expand if abnormal)",
      "hk": "say",
      "d": "A couple of breaths while I listen high on your chest. — Bates: compare symmetric anterior sites; above the breast covers the upper lobes and avoids displacing breast tissue. Expand if abnormal."
     },
     {
      "text": "Characterize breath sounds: vesicular, bronchovesicular, bronchial - and note any in an unexpected location",
      "short": "Characterize breath sounds",
      "hk": "narrate",
      "d": "Breath sounds vesicular throughout, with no bronchial breathing in an unexpected location."
     },
     {
      "text": "Identify adventitious sounds: crackles (fine/coarse), wheezes, rhonchi, stridor, pleural rub",
      "short": "Identify adventitious sounds",
      "hk": "narrate",
      "d": "No crackles, wheezes, rhonchi, stridor or pleural rub. — If present, say where and in which phase.",
      "url": "https://www.physio-pedia.com/Lung_Sounds"
     }
    ],
    "pocus": "Pleural effusion, pneumonia, pulmonary edema, pneumothorax. (STFM Delphi 2026)"
   },
   {
    "name": "Special tests",
    "items": [
     {
      "text": "Bronchophony",
      "lr": "(egophony/bronchophony, +LR ~4–6 for consolidation)",
      "tier": "C",
      "hk": "how",
      "d": "Bates: auscultate while the patient says ninety-nine. Normally the words sound muffled; louder, clearer words suggest consolidation. Perform only if bronchial or bronchovesicular sounds are heard where they do not belong."
     },
     {
      "text": "Egophony",
      "lr": "(“E-to-A” change, +LR ~4 for consolidation)",
      "tier": "C",
      "hk": "how",
      "d": "Bates: auscultate while the patient says ee. A change from ee to ay is egophony and suggests consolidation."
     },
     {
      "text": "Whispered pectoriloquy",
      "hk": "how",
      "d": "Bates: auscultate while the patient whispers ninety-nine or one-two-three. Normally the whisper is faint; louder, clearer whispered words suggest consolidation."
     }
    ]
   }
  ]
 },
 {
  "title": "Cardiovascular",
  "ros": "Chest pain, exertional dyspnea, palpitations, orthopnea/PND, edema, non-healing sores.",
  "note": "Echocardiography is the diagnostic standard for valve disease (ACC/AHA Class I); the exam decides whom to image. Heart-failure bedside signs: S3 +LR 4.0 and JVD +LR 2.8 (Martindale 2016 pooled), B-lines +LR ~9; a low BNP (< 100) is the best rule-out (−LR 0.11).",
  "groups": [
   {
    "name": "Core examination",
    "items": [
     {
      "text": "Note general appearance, blood pressure, heart rate",
      "hk": "narrate",
      "d": "Comfortable at rest, blood pressure and heart rate as recorded."
     },
     {
      "text": "Inspect neck: great vessels and carotid pulsation",
      "hk": "narrate",
      "d": "Carotid upstroke visible and brisk, no abnormal venous distension.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/neck-exam-jugular-venous-pressure-measurement.html"
     },
     {
      "text": "Evaluate and measure the JVP with the head of the bed at 30-45 degrees (adjust to see the meniscus)",
      "lr": "(elevated JVP, +LR 4.1 for volume overload; Drum 2026)",
      "tier": "C",
      "short": "Evaluate and measure the JVP",
      "hk": "how",
      "d": "Head of bed 30–45 degrees, head turned slightly away, tangential light. Find the meniscus of the internal jugular pulsation and measure vertically from the sternal angle, then add 5 cm.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/neck-exam-jugular-venous-pressure-measurement.html"
     },
     {
      "text": "Auscultate the carotids for bruits",
      "hk": "say",
      "d": "Take a breath in and hold it for me while I listen to your neck. — Always listen before you palpate."
     },
     {
      "text": "Palpate the carotid pulse: amplitude and contour",
      "hk": "say",
      "d": "Now I'll feel the pulse in your neck, one side at a time."
     },
     {
      "text": "Inspect the anterior chest for the apical impulse (sitting, supine, LLD)",
      "hk": "narrate",
      "d": "Apical impulse not visible on inspection. — Look sitting, supine, and in left lateral decubitus."
     },
     {
      "text": "Palpate for thrills at 4 areas (bony hand)",
      "hk": "how",
      "d": "Use the bony heel of the hand at the aortic, pulmonic, tricuspid and mitral areas. A palpable thrill means at least a grade 4 murmur.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/precordial.html"
     },
     {
      "text": "Palpate for heaves and lifts at 4 areas (finger pads)",
      "hk": "how",
      "d": "Use the finger pads over the same four areas, feeling for a sustained lift of a hypertrophied ventricle.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/precordial.html"
     },
     {
      "text": "Palpate and locate the PMI",
      "hk": "say",
      "d": "I'm going to feel for your heartbeat on your chest. — Normally 5th interspace, mid-clavicular line, under 2.5 cm.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/precordial.html"
     },
     {
      "text": "Auscultate all areas with the diaphragm, then repeat with the bell",
      "hk": "say",
      "d": "I'm going to listen to your heart in several spots. Just breathe normally.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/cardiac.html"
     },
     {
      "text": "Auscultate leaning forward (aortic regurgitation)",
      "hk": "say",
      "d": "Sit up and lean forward for me, breathe all the way out and hold. — Diaphragm at the left sternal border for aortic regurgitation."
     },
     {

  "note": "Ottawa ankle/foot/knee and Canadian C-Spine rules safely exclude fracture and cut imaging (high-sensitivity screens).6 for impingement; CTS-6 is the AAOS-preferred construct (2024) over Phalen or Tinel alone. Most single low-back red flags carry +LR ~1; a cancer history is the exception (+LR ~15). For elbow pain, ask about occupational biomechanical exposure: there is limited evidence of a causal relationship with lateral elbow tendinopathy (a Strain Index >5–6.1 roughly doubles risk), and insufficient evidence for medial tendinopathy (Curti 2021 SR).",

      "text": "Elbow flexion test (cubital tunnel)",
      "lr": "(cubital tunnel: mean +LR 27.66, −LR 0.72 across 3 studies — HIGHLY RECOMMENDED, Valdes & LaStayo 2013 J Hand Ther SR. Note the wide spread: Cheng +LR 45.99, Ochi +LR infinity, Beekman +LR 1.0; the mean −LR 0.72 means a negative test does NOT rule out cubital tunnel)",
      "tier": "B",
      "hk": "how",
      "d": "Valdes/Ochi: seated, shoulder neutral, elbow in maximum flexion, forearm supinated, wrist neutral. Hold actively for 60 seconds up to 3 minutes. Positive if the patient reports paraesthesia, or worsening of existing paraesthesia, in the ulnar nerve distribution.",

      "text": "Tinel sign at the cubital tunnel (ulnar neuropathy)",

      "hk": "how",
      "d": "Valdes/Beekman: tap lightly over the ulnar nerve in the groove between the medial epicondyle and the olecranon. Positive if the patient reports tingling or electrical sensations radiating to the 4th and 5th digits."

      "text": "Scratch collapse test (cubital tunnel)",

      "lr": "(cubital tunnel, pooled: sens 60.5%, spec 97.8%, kappa 0.64 — Jain 2023 Hand SR. Rule-IN only: pooled across all compressive neuropathies sens is just 37.5%, and for carpal tunnel it is 29.4% with kappa 0.18, so a negative result means nothing)",
      "hk": "how",
      "d": "Jain 2023: patient seated with elbows flexed and arms adducted, resisting bilateral shoulder external rotation. Scratch the skin over the site of suspected compression, then immediately retest resisted external rotation. A brief loss of resistance on the affected side is positive. Use it to confirm, not to screen."
     },

      "d": "Elbow flexed 90 degrees, forearm supinated. Hook your index finger under the lateral edge of the biceps tendon. Inability to hook a cord-like tendon is positive."

     {
      "text": "Passive forearm pronation test (distal biceps rupture)",
      "lr": "(sens 95.2%, spec 100%, −LR 0.05 — the best rule-out for distal biceps rupture; Zwerus 2018 SR)",

      "lr": "(MCL insufficiency: +LR infinity, −LR 0.05 — O'Driscoll 2005, rated 9/12 and listed as a recommended test in Valdes & LaStayo 2013; also in Zwerus 2018)",

      "short": "Moving valgus stress test (MCL)",
      "hk": "how",
      "d": "Shoulder abducted, apply constant valgus stress while moving the elbow from 120 to 70 degrees of flexion. Medial pain reproduced in that arc suggests MCL insufficiency."

      "short": "Grip strength test (dynamometer)",

      "d": "Measure grip with a handheld dynamometer in neutral and again with the elbow extended; a 5–10% decrease supports lateral epicondylosis. The only lateral epicondylosis test with accuracy data."
     },
     {
      "text": "Finkelstein test (de Quervain)",
      "hk": "how",
      "d": "Bates: the patient tucks the thumb into a fist and the wrist is ulnar-deviated. Pain along the radial side of the wrist suggests de Quervain tenosynovitis.",

     {
      "text": "Phalen test (carpal tunnel)",
      "lr": "(carpal tunnel: mean +LR 2.68, −LR 0.54 across 5 studies — highly recommended, Valdes & LaStayo 2013)",
      "tier": "C",
      "hk": "how",
      "d": "Bates: hold the wrists in full flexion for up to 60 seconds. Numbness or tingling in the median distribution within 60 seconds suggests carpal tunnel syndrome.",
      "url": "https://www.physio-pedia.com/Phalen%E2%80%99s_Test"
     },
     {
      "text": "Tinel sign at the wrist (carpal tunnel)",
      "lr": "(carpal tunnel: mean +LR 2.94, −LR 0.57 across 5 studies — highly recommended, Valdes & LaStayo 2013)",
      "tier": "C",
      "hk": "how",
      "d": "Bates: tap lightly over the median nerve at the carpal tunnel. Shooting pain or worsening numbness in the median distribution suggests carpal tunnel syndrome.",
      "url": "https://www.physio-pedia.com/Tinel%E2%80%99s_Test"
     },
     {
      "text": "Median / ulnar / radial sensory testing of the hand",
      "hk": "say",
      "d": "Close your eyes and tell me if this feels the same. — Median at the index pad, ulnar at the little finger, radial over the dorsal first web space."

   {

      "text": "Spurling A",

   {
    "name": "Special tests: hip",
    "items": [
     {
      "text": "Hip scour test",
      "sub": true,
      "hk": "how",
      "d": "Hip flexed 90 degrees, apply axial load through the femur while circumducting. Groin pain or catching is positive.",
      "url": "https://www.physio-pedia.com/Hip_Quadrant_Test",
      "short": "Hip scour test"
     },
     {
      "text": "FABER (Patrick) test",
      "hk": "how",
      "d": "Bates: flexion, abduction and external rotation in a figure-4. Bates lists it twice — groin pain suggests hip pathology, and pain in the SI area suggests SI joint dysfunction.",
      "url": "https://www.physio-pedia.com/FABER_Test"

     {
      "text": "FADIR test (intra-articular / labral)",
      "lr": "(a rule-out test; +LR ~1-2)",
      "tier": "D",
      "hk": "how",
      "d": "Flex the hip to 90 degrees, then adduct and internally rotate. Groin pain suggests femoroacetabular impingement or a labral tear. A rule-out test.",
      "url": "https://www.physio-pedia.com/FADIR_(Flexion,_Adduction,_Internal_Rotation)_Test"
     },
     {
      "text": "Log roll",
      "hk": "how",
      "d": "With the leg extended, roll the whole limb internally and externally. Pain suggests intra-articular hip pathology.",

   {
    "name": "Special tests: knee",
    "items": [
     {
      "text": "Effusion: bulge, ballottement, sweep",
      "hk": "how",
      "d": "Bulge sign for a small effusion: milk the medial side upward then stroke the lateral side and watch the medial dimple refill. Ballottement for a large effusion: push the patella down and feel it tap the femur.",
      "url": "https://www.physio-pedia.com/Knee_Swelling"
     },
     {
      "text": "McMurray test (meniscus)",
      "lr": "(+LR ~2.7 composite; ~1.3 in isolation)",
      "tier": "C",
      "hk": "how",
      "d": "Bates: flex the knee fully, then extend while rotating the tibia — external rotation with valgus for the medial meniscus, internal rotation with varus for the lateral. A palpable click or pain along the joint line is positive.",
      "url": "https://www.physio-pedia.com/McMurrays_Test"
     },
     {
      "text": "Valgus stress at 30 deg (MCL)",
      "lr": "(+LR 6.4 with laxity + pain + history; Kastelein 2008)",
      "tier": "B",
      "hk": "how",
      "d": "Knee flexed about 30 degrees with the thigh abducted; stabilize the femur and apply valgus force. Laxity plus pain plus a matching history gives +LR about 6.",
      "url": "https://www.physio-pedia.com/Valgus_Stress_Test"
     },
     {
      "text": "Varus stress (LCL)",
      "hk": "how",
      "d": "Same position, apply varus force. Laxity suggests LCL injury.",
      "url": "https://www.physio-pedia.com/Varus_Stress_Test"
     },
     {
      "text": "Lachman test (ACL)",
      "lr": "(+LR 8.8-42; strongest ACL test)",
      "tier": "A",
      "hk": "how",
      "d": "Knee flexed 20–30 degrees, stabilize the femur and draw the tibia forward. Increased translation with a soft endpoint is positive. The strongest ACL test.",
      "url": "https://www.physio-pedia.com/Lachman_Test"
     },
     {
      "text": "Anterior drawer (ACL)",
      "lr": "(+LR ~3.8)",
      "tier": "C",
      "hk": "how",
      "d": "Knee flexed 90 degrees, foot stabilized, draw the tibia forward. Less sensitive than Lachman.",
      "url": "https://www.physio-pedia.com/Anterior_Drawer_Test_of_Knee"
     },
     {
      "text": "Pivot shift (ACL)",
      "lr": "(+LR 16.0 [7.34-34.87]; Huang 2016)",
      "tier": "A",
      "hk": "how",
      "d": "Knee extended with internal rotation and valgus stress, then flex. A clunk of reduction at about 30 degrees is positive. Very high specificity.",
      "url": "https://www.physio-pedia.com/Pivot_Shift"
     },
     {
      "text": "Lever / Lelli sign (ACL)",
      "lr": "(+LR 1.4 prospective, Mulligan 2017; MA 3.15-6.6; adjunct to Lachman)",
      "tier": "D",
      "hk": "how",
      "d": "Place a fist under the proximal calf and press down on the distal thigh. Failure of the heel to lift suggests an ACL tear. Adjunct to Lachman.",
      "url": "https://www.physio-pedia.com/Lever_Sign_Test"
     },
     {
      "text": "Posterior drawer (PCL)",
      "lr": "(+LR ~21; a single small high-bias study reports ~98)",
      "tier": "A",
      "hk": "how",
      "d": "Knee flexed 90 degrees; look first for posterior sag, then push the tibia backward. Increased posterior translation is positive.",
      "url": "https://www.physio-pedia.com/Posterior_Drawer_Test_(Knee)"
     }
    ]
   },
   {
    "name": "Special tests: ankle and foot",
    "items": [
     {
      "text": "Thompson / calf-squeeze (Achilles rupture)",
      "lr": "(+LR 13.7; complete acute ruptures; Reiman 2014)",
      "tier": "A",
      "hk": "how",
      "d": "Patient prone with the knee flexed 90 degrees; squeeze the calf. Absent plantarflexion suggests an Achilles rupture.",
      "url": "https://www.physio-pedia.com/Thompson_Test"

     {
      "text": "Matles knee-flexion test (Achilles rupture)",
      "lr": "(+LR 6.29 [2.33-19.96]; Reiman 2014 SR of Maffulli 1998, single high-bias cohort)",
      "tier": "B",
      "hk": "how",
      "d": "Prone, actively flex the knee to 90 degrees and watch the foot. Loss of the normal plantarflexed resting posture suggests Achilles rupture.",
      "url": "https://www.physio-pedia.com/Matles_Test"
     },
     {
      "text": "Tendon-gap palpation (Achilles rupture)",
      "lr": "(+LR 6.64 [2.32-19.91]; Reiman 2014 SR of Maffulli 1998, single high-bias cohort)",
      "tier": "B",
      "hk": "how",
      "d": "Palpate along the Achilles from the calcaneus upward; a palpable gap suggests rupture.",

     },
     {
      "text": "Anterior drawer of the ankle (ATFL)",
      "hk": "how",
      "d": "Foot in slight plantarflexion; stabilize the tibia and draw the heel forward. Increased translation suggests ATFL injury.",
      "url": "https://www.physio-pedia.com/Anterior_Drawer_of_the_Ankle"
     },
     {
      "text": "Talar tilt test",
      "hk": "how",
      "d": "Hold the ankle in neutral and invert the talus. Increased tilt suggests calcaneofibular ligament injury.",
      "url": "https://www.physio-pedia.com/Talar_Tilt"
     },
     {
      "text": "Squeeze test (syndesmosis)",
      "hk": "how",
      "d": "Compress the tibia and fibula at mid-calf. Pain referred to the distal syndesmosis is positive.",
      "url": "https://www.physio-pedia.com/Squeeze_Test"
     }
    ]

 {
  "title": "Neurological",
  "ros": "Mood/attention/speech change; orientation, memory, judgment; headache, dizziness, vertigo, syncope; weakness, numbness, tingling, tremor, seizures.",
  "note": "For stroke, BE-FAST catches posterior strokes that FAST misses; ROSIER is the best-validated ED tool. The Ottawa SAH rule (sens ~100%) safely excludes subarachnoid hemorrhage. NICE recommends against ABCD2 for TIA.",
  "groups": [
   {
    "name": "Mental status and cranial nerves",
    "items": [
     {
      "text": "Mental status: level of alertness, orientation, language (fluency, comprehension, repetition, naming), memory",
      "short": "Mental status: alertness, orientation, language, memory",
      "hk": "say",
      "d": "I'm going to check a few things about memory and language. What do you call this? (hold up a pen, then a key) Now repeat after me: no ifs, ands, or buts."
     },
     {
      "text": "CN I — smell",
      "hk": "say",
      "d": "Close your eyes and block one nostril. Can you tell me what this smells like?"
     },
     {
      "text": "CN II — visual acuity and fields",
      "hk": "say",
      "d": "Cover one eye and read the smallest line you can, then look at my nose and tell me when my fingers move. — Bates tests CN II by acuity, visual fields and the fundoscopic exam."
     },
     {
      "text": "CN III/IV/VI — EOMs in the six cardinal directions of gaze; note nystagmus and ptosis",
      "short": "CN III/IV/VI — EOMs, six cardinal directions; nystagmus, ptosis",
      "hk": "say",
      "d": "Keep your head still and follow my finger with just your eyes. Now watch it come in toward your nose."
     },
     {
      "text": "CN II/III — pupillary light reflex, direct and consensual",
      "hk": "say",
      "d": "Look at the wall behind me. — Bates heads this Cranial Nerves II and III: the afferent limb is CN II, the efferent CN III. Note both the direct and the consensual response.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/pupillary.html"
     },
     {
      "text": "CN III — accommodation and convergence",
      "hk": "say",
      "d": "Look at the wall behind me, now look at my finger as I bring it toward your nose."
     },
     {
      "text": "CN V — motor (clench, jaw excursion); sensory (V1/V2/V3); corneal reflex",
      "hk": "say",
      "d": "Clench your teeth for me. Now open and move your jaw side to side. Close your eyes and tell me if this feels the same on your forehead, cheek and chin."
     },
     {
      "text": "CN VII — facial expression (brow, eyes, cheeks, smile)",
      "hk": "say",
      "d": "Raise your eyebrows, squeeze your eyes shut, puff out your cheeks, and give me a big smile."
     },
     {
      "text": "CN VIII — hearing (whisper test)",
      "hk": "say",
      "d": "I'm going to whisper some numbers behind you. Repeat what you hear."
     },
     {
      "text": "CN IX/X — palate rise, swallow, phonation, gag reflex",
      "hk": "say",
      "d": "Open and say ahh. — Watch the palate rise symmetrically and listen to the voice quality."
     },
     {
      "text": "CN XI — shoulder shrug, head turn against resistance",
      "hk": "say",
      "d": "Turn your head against my hand, now shrug your shoulders while I press down. — Bates: watch the OPPOSITE sternocleidomastoid contract on head turning, and note the force of the trapezius on shrugging."
     },
     {
      "text": "CN XII — tongue protrusion without deviation",
      "hk": "say",
      "d": "Stick your tongue straight out. — Bates: inspect the tongue at rest for atrophy or fasciculations first, then watch for deviation on protrusion."
     }
    ]
   },
   {
    "name": "Motor",
    "items": [
     {
      "text": "Inspect bulk, tone, and involuntary movements",
      "hk": "how",
      "d": "Look at the interossei, thenar and hypothenar eminences, shoulders, thighs and calves for wasting. Passively move each joint at varying speed to characterize tone as normal, spastic, rigid or flaccid."
     },
     {
      "text": "Pronator drift",
      "hk": "say",
      "d": "Hold both arms out in front, palms up, and close your eyes. — Drift and pronation suggests a contralateral corticospinal lesion."
     },
     {
      "text": "UE strength: elbow flexion/extension",
      "hk": "say",
      "d": "Bend your elbow and don't let me straighten it. Now push me away. — Grade 0–5 and support the upper arm to isolate the movement."
     },
     {
      "text": "UE strength: wrist flexion/extension",
      "hk": "say",
      "d": "Hold your wrist up and don't let me push it down."
     },
     {
      "text": "UE strength: fingers abduction/adduction, thumb opposition, grip",
      "hk": "say",
      "d": "Spread your fingers and don't let me squeeze them together. Touch your thumb to your little finger and hold. Squeeze my fingers."
     },
     {
      "text": "LE strength: hip flexion/extension/abduction/adduction",
      "hk": "say",
      "d": "Lift your leg and don't let me push it down. — Test hip extension prone."
     },
     {
      "text": "LE strength: knee flexion/extension",
      "hk": "say",
      "d": "Kick out against my hand, now pull your heel back toward you."
     },
     {
      "text": "LE strength: ankle dorsiflexion/plantarflexion",
      "hk": "say",
      "d": "Pull your toes up toward your nose, now push down like a gas pedal."
     }
    ]
   },
   {
    "name": "Coordination and gait",
    "items": [
     {
      "text": "Rapid alternating movements (bilateral)",
      "hk": "say",
      "d": "Pat your hand on your thigh, flipping it over and back as fast as you can. Now the other side.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/cerebellar.html"
     },
     {
      "text": "Point-to-point (finger-to-nose and heel-to-shin), then repeat with the eyes closed",
      "short": "Point-to-point, then repeat with eyes closed",
      "hk": "say",
      "d": "Touch my finger, then your nose, back and forth. Now run your heel down your shin. Now close your eyes and do it again. — Worsening with eyes closed means sensory, not cerebellar, ataxia.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/cerebellar.html"
     },
     {
      "text": "Observe gait",
      "hk": "say",
      "d": "Walk to the far wall and back for me, normally.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/gait.html"
     },
     {
      "text": "Heel-to-toe (tandem) walk",
      "hk": "say",
      "d": "Now walk heel to toe along this line, like a tightrope.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/gait.html"
     },
     {
      "text": "Walk on toes and heels",
      "hk": "say",
      "d": "Walk on your tiptoes, then on your heels. — Toe walking tests S1 plantarflexion, heel walking L4–L5 dorsiflexion.",
      "url": "https://stanfordmedicine25.stanford.edu/the25/gait.html"
     }
    ]
   },
   {
    "name": "Sensory",
    "items": [
     {
      "text": "Pain (sharp/dull)",
      "hk": "say",
      "d": "Close your eyes and tell me if this is sharp or dull, and whether it feels the same on both sides. — Bates: compare symmetric areas, vary the rhythm so the pattern is not predictable, and map from abnormal toward normal."
     },
     {
      "text": "Temperature sensation",
      "hk": "how",
      "d": "Touch a cool metal object such as the tuning fork to the skin and ask the patient to compare sides, eyes closed."
     },
     {
      "text": "Light touch (cotton wisp, compare symmetry)",
      "hk": "say",
      "d": "Close your eyes and say now each time you feel this. — Vary the rhythm and compare sides at each dermatome."
     },
     {
      "text": "Vibratory sense (tuning fork)",
      "hk": "say",
      "d": "Close your eyes and tell me when the buzzing stops. — 128 Hz fork on a distal interphalangeal joint; move proximally only if impaired."
     },
     {
      "text": "10-g monofilament at plantar sites (loss of protective sensation)",
      "lr": "(ADA/IDF/WHO standard screen for LOPS; sens ~57-93%, spec ~75-100% by technique; Feng 2009 J Vasc Surg SR)",
      "tier": "C",
      "short": "10-g monofilament at plantar sites",
      "hk": "say",
      "d": "Close your eyes and say yes when you feel me touch your foot. — Press until the filament buckles, at the standard plantar sites."
     },
     {
      "text": "Proprioception (big toe)",
      "hk": "say",
      "d": "Close your eyes. Tell me if I move your toe up or down. — Hold the toe on the sides to avoid pressure cues."
     },
     {
      "text": "Stereognosis",
      "hk": "how",
      "d": "Bates: place a familiar object — coin, paper clip, key, pencil or cotton ball — in the hand with the eyes closed. The patient should manipulate and identify it within 5 seconds. Inability is astereognosis."
     },
     {
      "text": "Graphesthesia",
      "hk": "how",
      "d": "Bates: with the blunt end of a pen or pencil, draw a large number in the patient's palm and ask them to identify it, eyes closed."
     },
     {
      "text": "Romberg test (station and position sense): feet together, arms at sides, ~30 s eyes open then ~30 s eyes closed",
      "short": "Romberg test",
      "hk": "say",
      "d": "Stand with your feet together and arms at your sides. Now close your eyes and hold still. — Stay close to steady them. Positive means sensory ataxia, not cerebellar."
     }
    ]

   {
    "name": "Special tests",
    "items": [
     {
      "text": "Babinski (plantar response)",
      "hk": "how",
      "d": "Stroke the lateral sole from heel to the ball of the foot, curving medially. Extension of the great toe is an abnormal (extensor) response.",

      "hk": "say",

      "text": "Nuchal rigidity (confirm no cervical injury before neck flexion)",

     {

const state = {
  scores: {},

          opt:{ros:true, ev:true} },

};
try {
  const s = JSON.parse(localStorage.getItem("rubric_v04")||"null");

  if (!state.scores) state.scores = {};
  if (!state.osce.inc) state.osce.inc = {};
  if (!state.osce.ros) state.osce.ros = {};
  if (!state.osce.vitals) state.osce.vitals = "verbalize";
  if (!state.osce.removed) state.osce.removed = {};
  if (!state.osce.lens) state.osce.lens = "combined";
  if (!state.practice) state.practice = { dur: 15, history: [], src: "osce" };
  if (!state.practice.history) state.practice.history = [];
  if (!state.practice.src) state.practice.src = "osce";
  const pn = localStorage.getItem("rubric_progname"); if (pn) setTimeout(()=>{document.getElementById("progname").textContent=pn;},0);
} catch(e){}
function persist(){ try{
  localStorage.setItem("rubric_v04", JSON.stringify(state));

}catch(e){} }

function esc(t){ return String(t).replace(/&(?!amp;|lt;|gt;|#)/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------- scoring ---------- */
function setScore(id,v){
  if (state.scores[id]===v) delete state.scores[id]; else state.scores[id]=v;
  render();
}
function ckToggle(id,checked){ if(checked) state.scores[id]=1; else delete state.scores[id]; render(); }
function pickCells(id,mx){
  const s=state.scores[id];
  let h="";
  for(let v=0;v<=mx;v++){
    h+=`<span class="pick ${s===v?"on":""}" role="button" tabindex="0" onclick="setScore('${id}',${v})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();setScore('${id}',${v})}">${v}</span>`;
  }
  return h;
}

function setMode(m){
  mode=m;
  document.getElementById("mComp").classList.toggle("on", m==="comp");
  document.getElementById("mOsce").classList.toggle("on", m==="osce");
  document.getElementById("mPrac").classList.toggle("on", m==="practice");
  document.body.classList.toggle("practice", m==="practice");
  document.getElementById("topclock").style.display = m==="practice" ? "" : "none";
  document.getElementById("lensswitch").style.display = m==="osce" ? "" : "none";
  render();
}
function setLens(l){ state.osce.lens=l; render(); }
function syncLensBtns(){
  const l=state.osce.lens||"combined";
  document.getElementById("lContent").classList.toggle("on", l==="content");
  document.getElementById("lComm").classList.toggle("on", l==="comm");
  document.getElementById("lBoth").classList.toggle("on", l==="combined");
}

/* ---------- COMPREHENSIVE PE ---------- */
function compCount(i){ let n=COMP[i].groups.reduce((a,g)=>a+g.items.filter(it=>!it.sub).length,0); return n+state.comp.local[i].length; }
function asideComp(){
  const o=state.comp.opt;
  return `<div class="panel"><h2>Systems in this rubric</h2><div id="systoggles">`+
    COMP.map((s,i)=>`<label class="toggle"><input type="checkbox" ${state.comp.enabled[i]?"checked":""} onchange="state.comp.enabled[${i}]=this.checked;render()"> ${esc(s.title)}<span class="pts">${compCount(i)}</span></label>`).join("")+
    `</div><div class="mini"><button onclick="compAll(true)">All</button><button onclick="compAll(false)">None</button></div></div>
    <div class="panel"><h2>Display</h2>
      <label class="toggle"><input type="checkbox" ${o.ros?"checked":""} onchange="state.comp.opt.ros=this.checked;render()"> ROS screening lines</label>

    <div class="panel about"><h2>About</h2><p>Base items are the published standard and are fixed for every program. Rows you add are marked <b>program-specific</b> and print shaded, so additions never blur into the shared standard. Check items as they are mastered or observed; the score populates automatically. Additions and scores save on this device.</p>
      <p>${esc(BREADTH_NOTE)}</p>
      <p>&copy; 2026 J. Moen &middot; CC BY-NC 4.0</p></div>`;
}
function compAll(v){ state.comp.enabled=COMP.map(()=>v); render(); }
function compRow(it,id){
  if(it.sub){ return `<tr class="item subrow"><td class="bx"></td><td class="what subc">${esc(it.text)}</td><td class="opts"></td></tr>`; }
  const on = state.scores[id]===1;
  return `<tr class="item"><td class="bx"><input type="checkbox" class="ck" ${on?"checked":""} onchange="ckToggle('${id}',this.checked)"></td><td class="what">${esc(it.text)}</td><td class="opts">${pickCells(id,1)}</td></tr>`;
}
function renderComp(){
  const o=state.comp.opt; let html="", total=0, earned=0;
  COMP.forEach((s,i)=>{
    if(!state.comp.enabled[i]) return;
    const n=compCount(i); total+=n;
    html+=`<section class="sys"><div class="sys-head"><h3>${esc(s.title)}</h3><span class="pts">${n} items &middot; ${n} pts</span></div>`;
    if(o.ros&&s.ros) html+=`<div class="ros"><b>ROS screen (ask &ge; 3):</b> ${esc(s.ros)}</div>`;
    html+=`<table class="items">`;
    s.groups.forEach((g,gi)=>{ html+=`<tr class="ghead"><td colspan="3">${esc(g.name)}</td></tr>`;
      g.items.forEach((it,ii)=>{ const id="c:"+i+":"+gi+":"+ii; if(!it.sub) earned+=state.scores[id]||0; html+=compRow(it,id); }); });
    if(state.comp.local[i].length){ html+=`<tr class="ghead"><td colspan="3">Program-specific additions</td></tr>`;
      state.comp.local[i].forEach((t,li)=>{ const id="cl:"+i+":"+li; earned+=state.scores[id]||0;
        html+=`<tr class="item local"><td class="bx"><input type="checkbox" class="ck" ${state.scores[id]===1?"checked":""} onchange="ckToggle('${id}',this.checked)"></td><td class="what">${esc(t)}<span class="local-chip">PROGRAM-SPECIFIC</span><button class="rm" onclick="state.comp.local[${i}].splice(${li},1);render()">&#x2715;</button></td><td class="opts">${pickCells(id,1)}</td></tr>`; }); }
    html+=`<tr class="addrow"><td colspan="3"><input placeholder="+ Add a program-specific item to ${esc(s.title)} (Enter)" onkeydown="if(event.key==='Enter'&&this.value.trim()){state.comp.local[${i}].push(this.value.trim());render()}"></td></tr></table>`;
    if(o.ev&&s.note) html+=`<div class="evnote"><b>Evidence adjunct:</b> ${esc(s.note)}</div>`;
    html+=`</section>`;
  });
  document.getElementById("sheettitle").textContent="Standardized Physical Examination Rubric";
  document.getElementById("sheetmeta").textContent="Comprehensive checklist · each item scored 0 / 1 (performed correctly / not)";
  document.getElementById("osceBanner").innerHTML="";
  document.getElementById("sheetfoot").innerHTML="<p>Base standard: <i>The Standardized Physical Examination</i> (J. Moen, 2026), CC BY-NC 4.0. Shaded rows are program-specific.</p><p>"+esc(BREADTH_NOTE)+"</p>";
  return {html: html||"<p style='color:var(--muted);padding:30px 0'>No systems selected.</p>", total, earned};
}

/* ---------- OSCE / SOAP (single SOAP-ordered spine; focused = base + program picks) ---------- */
function isComprehensive(){ return state.osce.station==="comprehensive"; }
function secIncluded(si){ return isComprehensive() || !!state.osce.inc[si]; }
function optSections(){
  const out=[];
  OSCE.spine.forEach((sec,si)=>{ if(sec.rows.some(r=>!r.base)) out.push(si); });
  return out;
}
function localKey(si){ return "sp:"+state.osce.station+":"+si; }
function osceAdd(si,val){ const k=localKey(si); (state.osce.local[k]=state.osce.local[k]||[]).push(val); render(); }
function osceRm(si,li){ state.osce.local[localKey(si)].splice(li,1); render(); }
function osceIncAll(v){ optSections().forEach(si=>{ state.osce.inc[si]=v; }); render(); }

/* One shared model drives the on-screen sheet AND the Word export. */
const ROWLABEL={};
function osceModel(){
  const secs=[];
  OSCE.spine.forEach((sec,si)=>{
    const inc=secIncluded(si);
    const useAlt = sec.vitals_slot && state.osce.vitals!=="perform";
    const src = useAlt ? sec.alt : sec.rows;
    const rows=[];
    src.forEach((row,ri)=>{
      if(!(row.base||inc)) return;
      const id=(useAlt?"ov:":"o:")+si+":"+ri;
      ROWLABEL[id]=row.text;
      if(state.osce.removed[id]) return;
      rows.push({id, text:row.text, max:row.sub?0:(row.max||1), verify:row.verify, sub:row.sub,
                 removable: !row.sub});
    });
    if(sec.ros_slot){
      OSCE.ros_options.forEach((o,oi)=>{ if(state.osce.ros[oi]) rows.push({id:"or:"+oi, text:o.text, max:o.max||1}); });
    }
    (state.osce.local[localKey(si)]||[]).forEach((t,li)=>rows.push({id:"ol:"+state.osce.station+":"+si+":"+li, text:t, max:1, local:true, li:li}));
    if(sec.footnote) rows.push({footnote:sec.footnote, fkind:"boards"});
    if(sec.pocus) rows.push({footnote:sec.pocus, fkind:"pocus"});
    if(rows.length) secs.push({si:si, phase:sec.phase, section:sec.section, rows:rows});
  });
  return secs;
}
function rmSpecial(id){
  const label=ROWLABEL[id]||"This maneuver";
  if(confirm('"'+label+'" is part of the national standard. It was selected to model full novice breadth and because it is tested on board examinations. Removing it means this rubric no longer matches the national standard.\n\nRemove it for your program anyway?')){
    state.osce.removed[id]=label; render();
  }
}
function restoreSpecial(id){ delete state.osce.removed[id]; render(); }
function restoreAll(){ state.osce.removed={}; render(); }

  const lens=state.osce.lens||"combined";
  let h=`<div class="panel"><h2>Station template</h2>

    <p style="font-size:12px;color:var(--muted);margin:8px 0 0">Most stations report vitals from the chart; early OSCEs may require the student to take each one.</p></div>`;

    `<p style="font-size:12px;color:var(--muted);margin:8px 0 0">Constitutional is always scored. Checked systems appear as scored rows in the Review of Systems section.</p></div>`;

    h+=`<div class="panel"><h2>Exam sections in this station</h2>`+
      optSections().map(si=>`<label class="toggle"><input type="checkbox" ${state.osce.inc[si]?"checked":""} onchange="state.osce.inc[${si}]=this.checked;render()"> ${esc(OSCE.spine[si].section)}</label>`).join("")+
      `<div class="mini"><button onclick="osceIncAll(true)">All</button><button onclick="osceIncAll(false)">None</button></div></div>`;
  }
  const rmIds=Object.keys(state.osce.removed||{});
  if(rmIds.length){
    h+=`<div class="panel"><h2>Removed standard items</h2>`+
      rmIds.map(id=>`<div class="toggle" style="justify-content:space-between;gap:10px"><span style="font-size:12.5px">${esc(state.osce.removed[id])}</span><button class="mini-restore" onclick="restoreSpecial('${id}')">Restore</button></div>`).join("")+
      `<div class="mini"><button onclick="restoreAll()">Restore all</button></div>
      <p style="font-size:11.5px;color:var(--muted);margin:8px 0 0">With items removed, this rubric no longer matches the national standard.</p></div>`;
  }
  h+=`<div class="rulebox"><h2>Who scores what</h2>

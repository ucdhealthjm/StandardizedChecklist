      <p>${esc(BREADTH_NOTE)}</p>
      <p>&copy; 2026 J. Moen &middot; CC BY-NC 4.0</p></div>`;
  return h;
}
function renderOsce(){
  const model=osceModel();
  const lens=state.osce.lens||"combined";
  syncLensBtns();
  /* content vs. video-observed subtotals across the whole station */
  let cTot=0,cEarn=0,kTot=0,kEarn=0;
  model.forEach(m=>m.rows.forEach(r=>{ if(r.footnote) return;
    if(r.verify){ kTot+=r.max; kEarn+=state.scores[r.id]||0; }
    else { cTot+=r.max; cEarn+=state.scores[r.id]||0; }
  }));
  let html="", lastPhase=null;
  html+=`<table class="items">`;
  model.forEach(m=>{
    const rows = lens==="content" ? m.rows.filter(r=>!r.verify)
               : lens==="comm"    ? m.rows.filter(r=>r.verify)
               : m.rows;
    if(!rows.length) return;
    if(m.phase && m.phase!==lastPhase){ html+=`<tr class="phase"><td colspan="2">${esc(m.phase)}</td></tr>`; lastPhase=m.phase; }
    html+=`<tr class="ghead"><td colspan="2">${esc(m.section)}</td></tr>`;
    rows.forEach(r=>{ if(r.footnote) return;
      if(r.sub){ html+=`<tr class="item subrow"><td class="what subc">${esc(r.text)}</td><td class="opts"></td></tr>`; return; }
      let what=esc(r.text);
      if(r.verify) what+=` <span class="vchip">SP + faculty verify</span>`;
      if(r.removable) what+=` <button class="rmspec" title="Remove from this program&rsquo;s rubric" onclick="rmSpecial('${r.id}')">&#x2715;</button>`;
      if(r.local) what+=`<span class="local-chip">PROGRAM-SPECIFIC</span><button class="rm" onclick="osceRm(${m.si},${r.li})">&#x2715;</button>`;
      html+=`<tr class="item${r.local?" local":""}"><td class="what">${what}</td><td class="opts">${pickCells(r.id,r.max)}</td></tr>`;
    });
    if(lens!=="comm") html+=`<tr class="addrow"><td colspan="2"><input placeholder="+ Add program-specific item to ${esc(m.section)} (Enter)" onkeydown="if(event.key==='Enter'&&this.value.trim()){osceAdd(${m.si},this.value.trim())}"></td></tr>`;
  });
  html+=`</table>`;
  const total = lens==="content"?cTot : lens==="comm"?kTot : cTot+kTot;
  const earned= lens==="content"?cEarn: lens==="comm"?kEarn: cEarn+kEarn;
  const label = isComprehensive() ? "Comprehensive station (full breadth)" : "Focused station (base + program-selected sections)";
  const lensName = lens==="content"?"SOAP content lens":lens==="comm"?"Video-observation lens":"Combined lens (content + video)";
  document.getElementById("sheettitle").textContent="OSCE Station Rubric";
  document.getElementById("sheetmeta").textContent=label+" · "+lensName;
  const lead = lens==="content"
      ? "<b>SOAP content lens.</b> Only items the SOAP note can document are shown; the SOAP-note rater scores this sheet. Communication and process items move to the video-observation lens."
      : lens==="comm"
      ? "<b>Video-observation lens.</b> The process items a chart cannot capture: hand hygiene, identification, open-ended questioning, ICE, empathy, transitions, teach-back, and closure, in encounter order. Scored by the standardized patient and a faculty video check."
      : "<b>Combined lens.</b> Every instrument on one sheet, in SOAP order. Use the toggle above to grade and print the SOAP content and the video-observed communication as separate scores.";
  document.getElementById("osceBanner").innerHTML=`<div class="osce-banner">${lead} <span style="white-space:nowrap">Subtotals: SOAP content <b>${cEarn} / ${cTot}</b> &middot; Video observation <b>${kEarn} / ${kTot}</b>.</span></div>`;
  document.getElementById("sheetfoot").innerHTML="<p>Items appear in SOAP order; base items are scored on every station. The SOAP-note rater scores the content lens; the standardized patient and a faculty video spot-check score the video lens. Shaded rows are program-specific additions.</p><p>"+esc(BREADTH_NOTE)+"</p><p>&copy; 2026 J. Moen &middot; CC BY-NC 4.0.</p>";
  return {html, total, earned};
}

/* ---------- PRACTICE (peer-graded repetition) ---------- */
/* Practice scores live under "p|" keys so a practice run never touches the grading sheet. */
const prac = { left: null, run: false, iv: null };
function tfmt(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function pracLeft(){ if(prac.left==null) prac.left=state.practice.dur*60; return prac.left; }
function pracDisp(){
  const t=tfmt(pracLeft()), low=pracLeft()<=120;
  const c=document.getElementById("pclock"); if(c){ c.textContent=t; c.classList.toggle("low",low); }
  const tc=document.getElementById("topclock"); if(tc){ tc.textContent=t; tc.style.color=low?"#FF8A80":""; }
  const b=document.getElementById("pstart"); if(b) b.textContent=prac.run?"Pause":(pracLeft()===state.practice.dur*60?"Start":"Resume");
}
function pracTick(){ prac.left--; if(prac.left<=0){ prac.left=0; pracPause(); } pracDisp(); }
function pracStart(){
  if(prac.run){ pracPause(); return; }
  if(pracLeft()<=0) prac.left=state.practice.dur*60;
  prac.run=true; prac.iv=setInterval(pracTick,1000); pracDisp();
}
function pracPause(){ prac.run=false; if(prac.iv){ clearInterval(prac.iv); prac.iv=null; } pracDisp(); }
function pracReset(){ pracPause(); prac.left=state.practice.dur*60; pracDisp(); }
function pracDur(v){ const n=Math.max(1,Math.min(120,parseInt(v,10)||15)); state.practice.dur=n; pracReset(); persist(); }
function practiceSrc(){ return state.practice.src==="comp" ? "comp" : "osce"; }
function practiceModel(){
  if(practiceSrc()==="comp") return compModel().map(s=>({section:s.section, phase:null, rows:s.rows}));
  return osceModel();
}
function pracTally(){
  let total=0, earned=0; const missed=[];
  practiceModel().forEach(m=>m.rows.forEach(r=>{ if(r.footnote) return;
    if(r.head||r.sub) return;
    total+=r.max; const v=state.scores["p|"+r.id]||0; earned+=v;
    if(v<r.max) missed.push(r.text.split(" (")[0]);
  }));
  return {total, earned, missed};
}
function finishAttempt(){
  const t=pracTally();
  if(!confirm("Save this attempt ("+t.earned+" / "+t.total+") and clear the sheet for the next run?")) return;
  state.practice.history.unshift({when:new Date().toLocaleDateString()+" "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}), score:t.earned, total:t.total, missed:t.missed});
  if(state.practice.history.length>30) state.practice.history.length=30;
  Object.keys(state.scores).forEach(k=>{ if(k.indexOf("p|")===0) delete state.scores[k]; });
  pracReset(); render();
}
function clearHistory(){ if(confirm("Delete all saved attempts on this device?")){ state.practice.history=[]; render(); } }
function asidePractice(){
  const hist=state.practice.history, last=hist[0];
  const isComp=practiceSrc()==="comp";
  let h=`<div class="panel"><h2>Practice</h2>
    <label class="radio"><input type="radio" name="psrc" ${!isComp?"checked":""} onchange="state.practice.src='osce';render()"> OSCE station</label>
    <label class="radio"><input type="radio" name="psrc" ${isComp?"checked":""} onchange="state.practice.src='comp';render()"> Comprehensive PE checklist</label></div>`;
  h+=`<div class="panel"><h2>Timer</h2>
    <div class="tclock" id="pclock">${tfmt(pracLeft())}</div>
    <div class="tdur"><label for="pdur">Minutes</label><input id="pdur" type="number" min="1" max="120" value="${state.practice.dur}" onchange="pracDur(this.value)"></div>
    <div class="mini"><button id="pstart" onclick="pracStart()">${prac.run?"Pause":"Start"}</button><button onclick="pracReset()">Reset</button></div></div>`;
  h+=`<div class="panel"><h2>This attempt</h2><button class="btn-finish" onclick="finishAttempt()">Finish &amp; save attempt</button></div>`;
  if(last){
    const shown=last.missed.slice(0,14);
    h+=`<div class="panel"><h2>Missed last attempt (${last.missed.length})</h2>`+
      (last.missed.length ? `<ul class="missed">${shown.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>${last.missed.length>shown.length?`<p style="font-size:11.5px;color:var(--muted);margin:6px 0 0">+ ${last.missed.length-shown.length} more</p>`:""}` : `<p style="font-size:12.5px;color:var(--muted);margin:0">Nothing missed. Full marks.</p>`)+
      `</div>`;
    h+=`<div class="panel"><h2>Attempt history</h2>`+
      hist.slice(0,10).map(a=>`<div class="attempt"><span>${esc(a.when)}</span><span class="pct">${a.score} / ${a.total} (${a.total?Math.round(100*a.score/a.total):0}%)</span></div>`).join("")+
      `<div class="mini"><button onclick="clearHistory()">Clear history</button></div></div>`;
  }
  h+=`<div class="panel about"><p>&copy; 2026 J. Moen &middot; CC BY-NC 4.0</p></div>`;
  return h;
}
function renderPractice(){
  const isComp=practiceSrc()==="comp";
  const model=practiceModel();
  let html="", total=0, earned=0, lastPhase=null;
  html+=`<table class="items">`;
  model.forEach(m=>{
    if(m.phase && m.phase!==lastPhase){ html+=`<tr class="phase"><td colspan="2">${esc(m.phase)}</td></tr>`; lastPhase=m.phase; }
    html+=`<tr class="ghead"><td colspan="2">${esc(m.section)}</td></tr>`;
    m.rows.forEach(r=>{
      if(r.footnote){ const fk=r.fkind||"boards";
        const FL={boards:"Know the name, not scored", pocus:"Recommended POCUS"};
        html+=`<tr class="footnote-row"><td colspan="2"><div class="offrubric ${fk}"><span class="oflabel">&#42; ${FL[fk]}</span>${esc(r.footnote)}</div></td></tr>`; return; }
      if(r.head){ html+=`<tr class="ghead"><td colspan="2">${esc(r.head)}</td></tr>`; return; }
      if(r.sub){ html+=`<tr class="item subrow"><td class="what subc">${esc(r.text)}</td><td class="opts"></td></tr>`; return; }
      const pid="p|"+r.id;
      total+=r.max; earned+=state.scores[pid]||0;
      const LBL={say:"Try saying",narrate:"Narrate aloud",tip:"Tip",how:"How to"};
      let guide="";
      if(r.d){
        const k=r.hk||"how";
        guide=`<div class="help ${k}"><span class="hlabel">${LBL[k]||"How to"}</span><span class="htext">${esc(r.d)}</span>`+
          (r.url?`<a class="reflink" href="${r.url}" target="_blank" rel="noopener">Watch demonstration &rarr;</a>`:"")+`</div>`;
      }
      html+=`<tr class="item${r.local?" local":""}"><td class="what">${esc(r.text)}${r.local?` <span class="local-chip">PROGRAM-SPECIFIC</span>`:""}${guide}</td><td class="opts">${pickCells(pid,r.max)}</td></tr>`;
    });
  });
  html+=`</table>`;
  document.getElementById("sheettitle").textContent=isComp?"Practice: Comprehensive PE":"Practice Station";
  document.getElementById("sheetmeta").textContent=(isComp?"Head-to-toe checklist":(isComprehensive()?"Comprehensive station":"Focused station"))+" · tap the score as each item is performed";
  document.getElementById("osceBanner").innerHTML=`<div class="osce-banner"><b>Practice run.</b> Grade to the criterion: incorrect technique scores 0, same as omitted. Press <b>Finish &amp; save attempt</b> to log the score and missed items.</div>`;
  document.getElementById("sheetfoot").innerHTML="<p>Practice attempts stay on this device and never affect the grading rubric.</p><p>&copy; 2026 J. Moen &middot; CC BY-NC 4.0.</p>";
  return {html, total, earned};
}

function render(){
  document.getElementById("aside").innerHTML = mode==="comp" ? asideComp() : mode==="osce" ? asideOsce() : asidePractice();
  const r = mode==="comp" ? renderComp() : mode==="osce" ? renderOsce() : renderPractice();
  document.getElementById("sections").innerHTML = r.html;
  document.getElementById("scorechip").textContent = `Score ${r.earned} / ${r.total}`;
  document.getElementById("sheettot").innerHTML = `Score: <span class="live">${r.earned}</span> / ${r.total}`;
  if(mode==="practice") pracDisp();
  persist();
}

/* ---------- export to Word (.doc) ---------- */
function fname(){
  const pn=(document.getElementById("progname").textContent||"rubric").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)||"rubric";
  if(mode==="practice") return pn+"-practice-"+(practiceSrc()==="comp"?"PE-checklist":"OSCE-"+state.osce.station);
  let nm = pn+"-"+(mode==="comp"?"PE-checklist":"OSCE-"+state.osce.station);
  if(mode==="osce" && (state.osce.lens||"combined")!=="combined") nm += "-"+(state.osce.lens==="content"?"SOAP-content":"video");
  return nm;
}
function compModel(){
  const secs=[];
  COMP.forEach((s,i)=>{
    if(!state.comp.enabled[i]) return;
    const rows=[];
    s.groups.forEach((g,gi)=>{ rows.push({head:g.name}); g.items.forEach((it,ii)=>rows.push({id:"c:"+i+":"+gi+":"+ii, text:it.text, max:it.sub?0:1, sub:it.sub, hk:it.hk, d:it.d, url:it.url})); if(g.footnote) rows.push({footnote:g.footnote, fkind:"boards"}); if(g.pocus) rows.push({footnote:g.pocus, fkind:"pocus"}); });
    if(state.comp.local[i].length){ rows.push({head:"Program-specific additions"});
      state.comp.local[i].forEach((t,li)=>rows.push({id:"cl:"+i+":"+li, text:t, max:1, local:true})); }
    secs.push({section:s.title, rows:rows});
  });
  return secs;
}
function exportDoc(){
  const src = mode==="practice" ? practiceSrc() : mode;   // "comp" or "osce"
  const isOsce = src!=="comp";
  const lens = (isOsce && mode!=="practice") ? (state.osce.lens||"combined") : "combined";
  const rawModel = mode==="practice" ? practiceModel() : (isOsce ? osceModel() : compModel());
  const model = lens==="combined" ? rawModel : rawModel.map(m=>Object.assign({}, m, {rows:(m.rows||[]).filter(r=> r.head ? true : (lens==="content" ? !r.verify : r.verify))}));
  const cols = isOsce ? 3 : 2;   // score columns: 0/1/2 or 0/1
  const width = 1+cols;
  let total=0, body="", lastPhase=null, hasVerify=false;
  model.forEach(m=>{
    let secPts=0, rowsHtml="";
    m.rows.forEach(r=>{ if(r.footnote) return;
      if(r.head){ rowsHtml+=`<tr class="gh"><td colspan="${width}">${esc(r.head)}</td></tr>`; return; }
      if(r.sub){ rowsHtml+=`<tr><td class="it" style="padding-left:22pt;font-style:italic;color:#5B6B7B">${esc(r.text)}</td><td colspan="${cols}"></td></tr>`; return; }
      secPts+=r.max; total+=r.max;
      if(r.verify) hasVerify=true;
      const sc=state.scores[(mode==="practice"?"p|":"")+r.id];
      let cells="";
      for(let v=0;v<cols;v++){
        cells += v<=r.max ? `<td class="sc${sc===v?" on":""}">${v}</td>` : `<td class="na">&nbsp;</td>`;
      }
      rowsHtml+=`<tr${r.local?' class="local"':''}><td class="it">${esc(r.text)}${r.verify?' <b>&dagger;</b>':''}${r.local?' <span class="lc">[PROGRAM-SPECIFIC]</span>':''}</td>${cells}</tr>`;
    });
    if(!rowsHtml) return;
    if(isOsce && m.phase && m.phase!==lastPhase){ body+=`<tr class="ph"><td colspan="${width}">${esc(m.phase)}</td></tr>`; lastPhase=m.phase; }
    body+=`<tr class="sh"><td>${esc(m.section)}</td><td colspan="${cols}" class="ssc">____ / ${secPts}</td></tr>`+rowsHtml;
  });
  body+=`<tr class="tt"><td>TOTAL</td><td colspan="${cols}" class="ssc">______ / ${total}</td></tr>`;
  const prog=esc(document.getElementById("progname").textContent);
  const lensSuffix = lens==="content" ? " (SOAP content)" : lens==="comm" ? " (Video observation)" : "";
  const title = (isOsce ? "OSCE Station Rubric" : "Standardized Physical Examination Rubric") + lensSuffix;
  const sub = document.getElementById("sheetmeta").textContent;
  const docStyle="<style>"+
    "body{font-family:Calibri,Arial,sans-serif;font-size:10.5pt;color:#1B2A3A;margin:24pt}"+
    "h1{color:#022851;font-size:16pt;margin:0 0 2pt}"+
    ".prog{color:#5B6B7B;font-size:9pt;letter-spacing:1pt;text-transform:uppercase;margin:0}"+
    ".sub{color:#5B6B7B;font-size:9.5pt;margin:2pt 0 8pt}"+
    ".ids{font-size:10.5pt;margin:6pt 0 10pt}"+
    "table{width:100%;border-collapse:collapse}"+
    "td{border:0.5pt solid #8894A2;padding:4pt 6pt;font-size:10pt;vertical-align:middle}"+
    "td.it{width:78%}"+
    "td.sc{width:30pt;text-align:center;font-size:11pt}"+
    "td.sc.on{background:#FFBF00;font-weight:bold}"+
    "td.na{background:#E8E8E8}"+
    "tr.ph td{background:#022851;color:#FFFFFF;font-weight:bold;font-size:9pt;letter-spacing:1.5pt;text-transform:uppercase}"+
    "tr.sh td{background:#E7EDF4;color:#022851;font-weight:bold;font-size:10.5pt}"+
    "tr.gh td{background:#F5F7FA;color:#022851;font-size:8pt;font-weight:bold;letter-spacing:.5pt;text-transform:uppercase}"+
    ".ssc{text-align:right;font-weight:bold;white-space:nowrap}"+
    "tr.local td{background:#FFF8E1}"+
    ".lc{color:#8A6D00;font-size:7.5pt;font-weight:bold}"+
    "tr.tt td{background:#FFBF00;color:#022851;font-weight:bold;font-size:12pt}"+
    ".leg{color:#5B6B7B;font-size:8.5pt;margin-top:8pt}"+
    "</style>";
  const legend=(hasVerify?"&dagger; Counted on this checklist and cross-verified by the standardized-patient communication score and faculty video spot-check. ":"")+
    "Circle the earned score on each row; incorrect technique scores 0. Gray cells do not apply. "+esc(BREADTH_NOTE)+" &copy; 2026 J. Moen, CC BY-NC 4.0.";
  const html="<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>"+
    "<head><meta charset='utf-8'><title>"+esc(fname())+"</title>"+docStyle+"</head><body>"+
    `<p class="prog">${prog}</p><h1>${title}</h1><p class="sub">${esc(sub)}</p>`+
    `<p class="ids">Student ______________________ &nbsp;&nbsp; Evaluator ______________________ &nbsp;&nbsp; Date ____________ &nbsp;&nbsp; <b>Score ______ / ${total}</b></p>`+
    `<table>${body}</table><p class="leg">${legend}</p></body></html>`;
  const blob=new Blob(["﻿"+html],{type:"application/msword"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname()+".doc";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

document.getElementById("progname").addEventListener("input", persist);
render();
</script>
